<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Ensure window.fetch has both a getter and setter to prevent read-only property assignment errors */
      (function() {
        try {
          var origFetch = window.fetch;
          var curFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return curFetch; },
            set: function(fn) { curFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto && Object.getOwnPropertyDescriptor(proto, 'fetch')) {
              var pFetch = proto.fetch;
              var curP = pFetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() { return curP; },
                set: function(fn) { curP = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }
      })();
    </script>
